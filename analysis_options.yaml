analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    unused_import: error
    unused_local_variable: error
    inference_failure_on_collection_literal: error
linter:
  rules:
    - always_declare_return_types
    - curly_braces_in_flow_control_structures
    - avoid_dynamic_calls
    - hash_and_equals
    - prefer_final_fields
    - unnecessary_lambdas
