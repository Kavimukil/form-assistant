version: 0.1.0
publish_to: none
environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.16.0"
dependencies:
  flutter:
    sdk: flutter
  form_assistant_core:
    path: ../form_assistant_core
dev_dependencies:
  flutter_test:
    sdk: flutter
